repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.4.0
  hooks:
  - id: check-yaml
    args: ['--unsafe'] # avoid problems with mkdocs mermaid extension
    stages:
    - commit
  - id: check-toml
    stages:
    - commit
  - id: end-of-file-fixer
    exclude: "{{_copier_conf.answers_file}}" # auto-generated
    stages:
    - commit
  - id: trailing-whitespace
    exclude: "{{_copier_conf.answers_file}}" # auto-generated
    stages:
    - commit
  - id: debug-statements
    stages:
    - commit
- repo: https://github.com/pre-commit/pygrep-hooks
  rev: v1.10.0
  hooks:
  - id: python-no-eval
    stages:
    - commit
- repo: https://github.com/psf/black
  rev: 23.1.0
  hooks:
  - id: black
    stages:
    - commit
  - id: black-jupyter
    stages:
    - commit
- repo: https://github.com/econchick/interrogate
  rev: 1.5.0
  hooks:
  - id: interrogate
    stages:
    - commit
- repo: https://github.com/pycqa/isort
  rev: 5.12.0
  hooks:
  - id: isort
    stages:
    - commit
- repo: https://github.com/jumanjihouse/pre-commit-hooks
  rev: '3.0.0'
  hooks:
  - id: forbid-binary
    stages:
    - commit
