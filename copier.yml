_subdirectory: reproML

# basics
project_name:
  type: str
  help: What is your project name?
  default: "{{ _folder_name }}"

project_name_slug:
    type: str
    help: A slug of the name
    default: "{% from 'slugify.jinja' import slugify %}{{ slugify(project_name) }}"
    validator: "{% from 'slugify.jinja' import slugify %}{% if project_name_slug != slugify(project_name_slug) %}Invalid slug.{% endif %}"

project_description:
  type: str
  help: A brief summary of what you want to achieve.

python_version:
  type: str
  help: Which Python version do you want to use?
  choices:
    - "3.9"
    - "3.10"
    - "3.11"
    - "3.12"
    - "3.13"

author:
  type: str
  help: What is your name?

author_email:
  type: str
  help: What is your email adress?

# git integration
ci:
  type: str
  help: What CI service do you want to use?
  choices:
      GitHub Actions: github
      GitLab CICD: gitlab
      Skip for now: none

repo_url:
  type: str
  help: Where is the git repo hosted? Just press enter to skip.
  placeholder: https://
  default: ""

default_branch:
  type: str
  help: What do you want to name your default branch?
  default: main
  validator: "{% from 'slugify.jinja' import slugify %}{% if default_branch != slugify(default_branch) %}Invalid branch name.{% endif %}"

# dvc
use_dvc:
  type: bool
  help: Dou you want to use data version control?
  default: false

remote_type:
  type: str
  help: Which storage backend do you want to install? If in doubt, use all.
  choices:
    Install no backend: ""
    Amazon S3: s3
    Microsoft Azure Blob Storage: azure
    Google Cloud Storage: gs
    Google Drive: gdrive
    SSH and SFTP: ssh
    HDFS: hdfs
    WebDAV: webdav
    Aliyun OSS: oss
    Install all backends: all
  default: ""
  when: "{{ use_dvc }}"

remote_location:
  type: str
  help: Supply remote storage location. Keep empty to skip.
  placeholder: "{{ remote_type }}://"
  default: ""
  when: "{% if remote_type != '' %}{% if remote_type != 'all' %}{{ use_dvc }}{% endif %}{% endif %}"

# extra documentation
ethics_checklist:
  type: bool
  help: Do you want to add the deon ethics checklist to your documentation?
  default: true

# commands to run post generation
_tasks:
  # setup repo
  - "git init"
  - "git config user.name {{author}}"
  - "git config user.email {{author_email}}"
  - "{% if repo_url != '' %} git remote add origin {{repo_url}} {% endif %}"
  # setup environment
  - "uv sync --python {{python_version}} --all-groups --all-extras"
  - "uv run pre-commit install --hook-type pre-push --hook-type post-checkout --hook-type pre-commit"
  # setup dvc
  - "{% if remote_location != '' %} uv run dvc remote add -d remote0 {{remote_location}} {% endif %}"
  # extra documentation
  - "{% if ethics_checklist %} uv run --with deon deon -o docs/ethics.md {% endif %}"
  # initial commit
  - "git checkout -b {{default_branch}}"
  - "git add ."
  - "git commit -m 'Init from template: github.com/Excidion/reproML'."
  #- "{% if repo_url != '' %} poetry run git push origin {{default_branch}} {% endif %}"

_exclude:
  - docs/reproML.md # only for docs of template itself
