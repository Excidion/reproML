# basics
project_name:
  type: str
  help: What is your project name?

project_description:
  type: str
  help: A brief summary of what you want to achieve.

python_version:
  type: str
  help: Which Python version do you want to use?
  choices:
    - "3.9"
    - "3.10"
    - "3.11"
    - "3.12"

license:
  str:
  help: How this code should be licensed, if at all.
  choices:
    - NO_LICENSE
    - PROPRIETARY
    - PUBLIC DOMAIN
    - UNLICENSE
    - BOOST
    - MIT
    - BSD
    - ISC
    - NCSA
    - PYTHON
    - APACHE
    - ECLIPSE
    - AFL
    - AGPL
    - LGPL
    - LGPLV2
    - LGPLV2+
    - LGPLV3
    - LGPLV3+
    - GPL
    - GPLV2
    - GPLV2+
    - GPLV3
    - GPLV3+
    - MPL
    - EUPL

author:
  type: str
  help: What is your name?

author_email:
  type: str
  help: What is your email adress?

# git integration
ci:
  type: str
  help: What CI service do you want to use?
  choices:
      GitHub Actions: github
      GitLab CICD: gitlab
      Skip for now: none

repo_url:
  type: str
  help: Where is the git repo hosted? Just press enter to skip.
  placeholder: https://
  default: ""

default_branch:
  type: str
  default: main

# dvc
use_dvc:
  type: bool
  help: Dou you want to use data version control?
  default: true

remote_type:
  type: str
  help: Which storage backend do you want to install? If in doubt, use all.
  choices:
    Install no backend: ""
    Amazon S3: s3
    Microsoft Azure Blob Storage: azure
    Google Cloud Storage: gs
    Google Drive: gdrive
    SSH and SFTP: ssh
    HDFS: hdfs
    WebDAV: webdav
    Aliyun OSS: oss
    Install all backends: all
  default: ""
  when: "{{ use_dvc }}"

remote_location:
  type: str
  help: Supply remote storage location. Keep empty to skip.
  placeholder: "{{ remote_type }}://"
  default: ""
  when: "{% if remote_type != '' %}{% if remote_type != 'all' %}{{ use_dvc }}{% endif %}{% endif %}"

# commands to run post generation
_tasks:
  # setup repo
  - "git init"
  - "git config user.name {{author}}"
  - "git config user.email {{author_email}}"
  - "{% if repo_url != '' %} git remote add origin {{repo_url}} {% endif %}"
  # setup environment
  - "uv sync --group dev"
  - "uv run pre-commit install --hook-type pre-push --hook-type post-checkout --hook-type pre-commit"
  # setup dvc
  - "{% if remote_location != '' %} uv run dvc remote add -d remote0 {{remote_location}} {% endif %}"
  # initial commit
  - "git checkout -b {{default_branch}}"
  - "git add ."
  - "git commit -m 'Init from template {{_src_path}}'."
  #- "{% if repo_url != '' %} poetry run git push origin {{default_branch}} {% endif %}"

_exclude:
  - ".git" # template history
  - "copier.yml" # template definition
  - "LICENSE.md" # has to be chosen project specific
  - ".github/workflows/build_pages.yml" # for pages of the template itself
  - "uv.lock" # force fresh resolving of deps
