site_name: Documentation

theme:
  name: "material"
  palette:
    scheme: slate
    primary: teal

plugins:
  - search
  - mkdocstrings

markdown_extensions:
  # admonitions
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables # data tables
  # support for flowcharts via mermaid
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # support for formulas
  - pymdownx.arithmatex:
      generic: true
# support for formulas
extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
