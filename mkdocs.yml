site_name: Documentation

theme:
  name: "material"

plugins:
  - search
  - mkdocstrings

# support for flowcharts via mermaid
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
